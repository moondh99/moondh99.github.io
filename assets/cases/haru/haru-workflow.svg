<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="title desc">
<title id="title">Haru 에이전트와 검증 구조</title><desc id="desc">정리, 추정, 우선순위, 배치, 위험 점검, 코칭의 여섯 에이전트. 날짜와 시간 계산, 규칙 검증은 코드가 수행하고 사용자가 확인한 뒤 캘린더 파일을 내보낸다.</desc>
